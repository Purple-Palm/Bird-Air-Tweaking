name: Pages refresh

# В режиме Pages «Deploy from a branch» GitHub пересобирает сайт только после пушей
# человека: пуши от приложения (бота) сборку не запускают, и сайт застревает на старой
# версии. Этот job сам просит сборку, если запушена именно ветка-источник Pages.
# В режиме «GitHub Actions» сайт собирает pages.yml, а этот job ничего не делает.

on:
  push:
    paths-ignore:
      - 'logs/**'

permissions:
  contents: read
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages build for the source branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! cfg=$(gh api "repos/$REPO/pages" 2>/dev/null); then
            echo "Pages не включён — пропускаю"; exit 0
          fi
          type=$(jq -r '.build_type' <<<"$cfg")
          branch=$(jq -r '.source.branch' <<<"$cfg")
          echo "Pages: $type, ветка-источник $branch; пуш в $GITHUB_REF_NAME"
          if [ "$type" = legacy ] && [ "$branch" = "$GITHUB_REF_NAME" ]; then
            gh api -X POST "repos/$REPO/pages/builds"
          else
            echo "Сборку этой ветки делает не этот job — пропускаю"
          fi
