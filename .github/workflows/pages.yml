name: Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'logs/**'
      - 'tests/**'
      - 'tools/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for committed tokens
        run: python3 tools/check_secrets.py

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets decoders _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
